name: Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_WEB: ${{ github.repository_owner }}/mvp-web
  IMAGE_MCP: ${{ github.repository_owner }}/mcp-connector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./fullstack-mvp/apps/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}
      - name: Build and push mcp-connector
        uses: docker/build-push-action@v6
        with:
          context: ./fullstack-mvp/services/mcp-connector
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_MCP }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger web deploy
        if: ${{ secrets.DEPLOY_WEB_HOOK_URL != '' }}
        run: curl -X POST "$DEPLOY_WEB_HOOK_URL"
        env:
          DEPLOY_WEB_HOOK_URL: ${{ secrets.DEPLOY_WEB_HOOK_URL }}
      - name: Trigger mcp deploy
        if: ${{ secrets.DEPLOY_MCP_HOOK_URL != '' }}
        run: curl -X POST "$DEPLOY_MCP_HOOK_URL"
        env:
          DEPLOY_MCP_HOOK_URL: ${{ secrets.DEPLOY_MCP_HOOK_URL }}